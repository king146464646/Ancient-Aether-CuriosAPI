name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Ancient Aether
        uses: actions/checkout@v4

      - name: Checkout The Aether (Curios API)
        uses: actions/checkout@v4
        with:
          repository: king146464646/The-Aether-CuriosAPI
          ref: 1.21.1-develop
          path: The-Aether-CuriosAPI

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish The Aether (Curios API) to mavenLocal
        working-directory: The-Aether-CuriosAPI
        run: |
          chmod +x ./gradlew
          ./gradlew publishToMavenLocal --console=plain

      - name: Build mod
        run: |
          chmod +x ./gradlew
          ./gradlew build --parallel --console=plain

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ancient-aether-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
